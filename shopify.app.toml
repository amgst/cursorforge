# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d5916a31a775379272cc4974e38df49b"
name = "CursorForge"
application_url = "https://cursorforge-two.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  # Mandatory privacy webhooks for App Store apps; handled in src/routes/webhooks.compliance.ts.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# write_files: upload cursor images to Shopify Files. The cursor config metafield lives on
# the app's own installation, which needs no extra scope.
scopes = "write_files"

[auth]
redirect_urls = [ "https://cursorforge-two.vercel.app/api/auth" ]
